name = "naming-studio-api"
main = "src/index.ts"
compatibility_date = "2024-11-01"

# The API's own door: api.namename.ai (the namename.ai zone lives on
# Cloudflare since 2026-10-21). workers.dev stays as a fallback host.
routes = [{ pattern = "api.namename.ai", custom_domain = true }]
# REQUIRED alongside routes: wrangler disables the workers.dev URL by default
# once a route exists, and the app still calls workers.dev (21 Oct outage).
workers_dev = true

# Secrets / vars (set via wrangler, NOT committed):
#   npx wrangler secret put ANTHROPIC_API_KEY   # required: your Anthropic API key
#   (optional) [vars] ALLOWED_ORIGIN = "https://dimitri-frb.github.io"  # lock CORS

# Central request log (the /admin page → Central). Bound to a KV namespace.
[[kv_namespaces]]
binding = "LOG"
id = "6deae9f7e8774986ab1e38423de11394"

# (optional) protect the read endpoint with a key the /admin page must supply:
#   npx wrangler secret put ADMIN_KEY

# Google sign-in: the OAuth Web client id (public, not a secret). The Worker
# verifies sign-in tokens were minted for THIS app.
[vars]
GOOGLE_CLIENT_ID = "406174169000-ma0br2rqmorv5iqcfmo4dck0at5ivohu.apps.googleusercontent.com"
# Who may read the funnel ("All names" in the account):
ADMIN_EMAILS = "dimitri@dfginvest.fr"
# The postal address every email footer carries (EU/US anti-spam rules).
POSTAL_ADDRESS = "122 rue Amelot, 75011 Paris"

# Lifecycle emails (handoff 15): the Email Sending binding + the hourly
# stop-email pass. POSTAL_ADDRESS is read by the email footers once set.
[[send_email]]
name = "EMAIL"

[triggers]
crons = ["5 * * * *"]
